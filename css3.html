<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Cube | The Museum of Illusions</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .scene {
      width: 200px;
      height: 200px;
      margin: 50px 0;
      transition: transform 0.5s;
    }
    
    .scene:hover {
      transform: scale(1.3);
    }

    /* the cube holds the 6 faces and rotates all of them together */
    .cube {
      position: relative;
      width: 200px;
      height: 200px;
      transform-style: preserve-3d;   /* keep the faces in 3D */
      animation: spin 10s linear infinite;
    }

    /* each face is a normal flat square */
    .face {
      position: absolute;
      width: 200px;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4.5rem;
      font-weight: bold;
      color: #00ff66;
      background: rgba(0, 255, 102, 0.1);
      border: 3px solid #00ff66;
    }
    .face:nth-child(even) {
      color: #d98cff;
      background: rgba(192, 77, 255, 0.12);
      border-color: #c04dff;
    }

    /* turn each square to its side, then push it out by half the cube size (100px) */
    .face:nth-child(1) { transform: rotateY(0deg)   translateZ(100px); }
    .face:nth-child(2) { transform: rotateY(90deg)  translateZ(100px); }
    .face:nth-child(3) { transform: rotateY(180deg) translateZ(100px); }
    .face:nth-child(4) { transform: rotateY(-90deg) translateZ(100px); }
    .face:nth-child(5) { transform: rotateX(90deg)  translateZ(100px); }
    .face:nth-child(6) { transform: rotateX(-90deg) translateZ(100px); }

    @keyframes spin {
      from { transform: rotateX(-25deg) rotateY(0deg); }
      to   { transform: rotateX(-25deg) rotateY(360deg); }
    }
  </style>
</head>
<body>

  <a class="btn nav-home" href="index.html">HOME</a>

  <div class="blob green"></div>
  <div class="blob purple"></div>

  <main class="stage">
    <h1 class="page-title">3D Cube</h1>

    <div class="scene">
      <div class="cube">
        <div class="face">M</div>
        <div class="face">U</div>
        <div class="face">S</div>
        <div class="face">E</div>
        <div class="face">U</div>
        <div class="face">M</div>
      </div>
    </div>

    <p class="caption">
      A cube made from six flat divs. <code>perspective</code> and
      <code>transform-style: preserve-3d</code> create the 3D illusion. Hover to enlarge it.
    </p>
